<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Princess - Castelo das Princesas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>👑 Princess 👑</h1>
    <p>Castelo das Princesas</p>
  </header>

  <div class="controls-info">
    <div class="control-player">
      <span class="dot lais"></span> <strong>Lais</strong> (setas) + passeia com o <strong>🐱 gato</strong>
    </div>
    <div class="control-player">
      <span class="dot sofia"></span> <strong>Sofia</strong> (WASD) + passeia com o <strong>🐶 cachorro</strong>
    </div>
  </div>

  <div id="world">

    <!-- ÁREA DO JARDIM -->
    <div class="area-label jardim">🌸 Jardim 🌸</div>

    <!-- CASTELO DA LAIS -->
    <div class="castle castle-lais" id="castleLais">
      <div class="castle-top">👑</div>
      <div class="castle-body">
        <div class="castle-name">Lais</div>
      </div>
    </div>

    <!-- CASTELO DA SOFIA -->
    <div class="castle castle-sofia" id="castleSofia">
      <div class="castle-top">👸</div>
      <div class="castle-body">
        <div class="castle-name">Sofia</div>
      </div>
    </div>

    <!-- PERSONAGENS -->
    <div class="player" id="lais">
      <div class="emoji lais-emoji">👸</div>
      <div class="name-tag lais">Lais</div>
    </div>
    <div class="player" id="sofia">
      <div class="emoji sofia-emoji">👸</div>
      <div class="name-tag sofia">Sofia</div>
    </div>

    <!-- PETS -->
    <div class="pet" id="gato">
      <div class="emoji">🐱</div>
      <div class="name-tag">Gato</div>
    </div>
    <div class="pet" id="cachorro">
      <div class="emoji">🐶</div>
      <div class="name-tag">Cachorro</div>
    </div>

    <!-- GUARDA-ROUPAS -->
    <div class="wardrobe wardrobe-lais" id="wardrobeLais">
      <div class="emoji">🚪👗</div>
      <div class="name-tag">Guarda-roupa da Lais</div>
    </div>
    <div class="wardrobe wardrobe-sofia" id="wardrobeSofia">
      <div class="emoji">🚪👗</div>
      <div class="name-tag">Guarda-roupa da Sofia</div>
    </div>

    <!-- ATIVIDADES DO CASTELO DA LAIS -->
    <div class="activity" id="latv1" style="left:0px; top:0px;">🌹</div>
    <div class="activity" id="latv2" style="left:114px; top:0px;">🪞</div>
    <div class="activity" id="latv3" style="left:228px; top:0px;">👗</div>
    <div class="activity" id="latv4" style="left:0px; top:114px;">🎀</div>
    <div class="activity" id="latv5" style="left:114px; top:114px;">💎</div>
    <div class="activity" id="latv6" style="left:228px; top:114px;">📚</div>
    <div class="activity" id="latv7" style="left:0px; top:228px;">🎨</div>
    <div class="activity" id="latv8" style="left:114px; top:228px;">🎵</div>

    <!-- ATIVIDADES DO CASTELO DA SOFIA -->
    <div class="activity" id="satv1" style="left:560px; top:0px;">🌹</div>
    <div class="activity" id="satv2" style="left:674px; top:0px;">🪞</div>
    <div class="activity" id="satv3" style="left:788px; top:0px;">👗</div>
    <div class="activity" id="satv4" style="left:560px; top:114px;">🎀</div>
    <div class="activity" id="satv5" style="left:674px; top:114px;">💎</div>
    <div class="activity" id="satv6" style="left:788px; top:114px;">📚</div>
    <div class="activity" id="satv7" style="left:560px; top:228px;">🎨</div>
    <div class="activity" id="satv8" style="left:674px; top:228px;">🎵</div>

  </div>

  <div id="progress">
    <div class="progress-card">
      <span class="dot lais"></span> Lais: <span id="laisScore">0</span>/10
      <div class="bar"><div id="laisBar" class="fill lais"></div></div>
    </div>
    <div class="progress-card">
      <span class="dot sofia"></span> Sofia: <span id="sofiaScore">0</span>/10
      <div class="bar"><div id="sofiaBar" class="fill sofia"></div></div>
    </div>
  </div>

  <div id="modal" class="hidden">
    <div id="modal-content">
      <h2 id="modal-title"></h2>
      <p id="modal-text"></p>
      <button id="modal-close">Fechar</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
